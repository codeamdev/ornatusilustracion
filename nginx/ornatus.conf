server {
    listen 80;
    server_name ornatusilustracion.com www.ornatusilustracion.com;

    # Redirigir HTTP → HTTPS (descomentar cuando tengas SSL)
    # return 301 https://$host$request_uri;

    # ── Imágenes subidas — servidas directamente por nginx (sin pasar por Node) ──
    location /uploads/ {
        alias /var/www/ornatus/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Proxy al contenedor Next.js ───────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

